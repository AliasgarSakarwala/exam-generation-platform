name: Run Build
on:
  pull_request:
    branches:
      - Front-End

  push:
    branches:
      - Front-End

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm i

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test
